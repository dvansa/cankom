name: App Android CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Create dummie maps API key
        run: echo 'API_KEY=aBcDe12345' > local.properties

      - name: Permissions on gradlew
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build

      - name: Assemble APK (Debug)
        run: ./gradlew assemble

      - name: Assemble APK (Releae)
        run: ./gradlew assembleRelease